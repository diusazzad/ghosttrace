services:
  - type: web
    name: ghosttrace
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ghosttrace
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_SECRET
        sync: false
      - key: AUTH0_BASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: AUTH0_ISSUER_BASE_URL
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_AUDIENCE
        value: https://api.ghosttrace.dev
      - key: SENTRY_DSN
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: ULTRAMARINE_API_KEY
        sync: false
      - key: TABPFN_API_KEY
        sync: false
